name: Deploy to Cloudflare

# Builds the SPA and deploys the Worker (app + generation API) on every push to
# main. Replaces the legacy GitHub Pages deploy.
#
# Requires:
#   - Repo secret  CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit, Workers R2
#     Storage:Edit, Account Settings:Read — the "Edit Cloudflare Workers" template)
#   - Repo Actions variables VITE_FIREBASE_* (public web config, baked into the build)
#
# The Worker's runtime secrets (STITCH_AI_KEY, INTERNAL_API_KEY,
# FIREBASE_SERVICE_ACCOUNT, CONTEXT_KEY) are stored in Cloudflare and persist
# across deploys — they are NOT set here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel an in-progress publish.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Media authority is deliberately fixed. The workers.dev hostname is
          # accepted only to migrate stored legacy references, never emitted.
          VITE_PUBLIC_ORIGIN: https://spool.stitchtec.dev
          VITE_LEGACY_MEDIA_ORIGINS: https://spool.kist.workers.dev
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Verify deploy toolchain
        run: |
          test "$(node --version)" = "v22.19.0"
          test "$(./node_modules/.bin/wrangler --version)" = "4.116.0"
      - name: Deploy Worker
        run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
