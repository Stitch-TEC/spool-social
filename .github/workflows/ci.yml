name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Unit tests import src/config/firebase.js, which calls getAuth() at module
    # load — that throws auth/invalid-api-key without an API key. CI has no .env
    # (it's gitignored), so provide harmless dummy Firebase config for the run.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_APP_ID: ci-dummy-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high
