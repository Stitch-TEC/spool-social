name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Unit tests import src/config/firebase.js, which calls getAuth() at module
    # load — that throws auth/invalid-api-key without an API key. CI has no .env
    # (it's gitignored), so provide harmless dummy Firebase config for the run.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_APP_ID: ci-dummy-app-id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify exact Node runtime
        run: node -e "if (process.version !== 'v22.19.0') throw new Error('Expected Node v22.19.0, got ' + process.version)"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Enforce immutable action pins
        run: npm run test:action-pins
      - run: npm run lint
      - run: npm run test
      - run: npm run test:rules
      - run: npm run build
      # The Worker only gets bundled at deploy time (wrangler), so a syntax error
      # in worker/*.js would otherwise surface AFTER merge, in the production
      # deploy job. This is a cheap pre-merge guard, not a full bundle check.
      - name: Worker syntax check
        run: for f in worker/*.js; do node --check "$f"; done

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify exact Node runtime
        run: node -e "if (process.version !== 'v22.19.0') throw new Error('Expected Node v22.19.0, got ' + process.version)"
      - run: npm ci
      # This job is expected to be GREEN. It was permanently red from ~2026-07-29
      # to 2026-08-03 (6+ consecutive runs) on dev-toolchain advisories, which
      # trained everyone to ignore it — a genuine regression would have blended
      # straight in. If it goes red, treat it as a real finding, not as noise.
      #
      # Two pins in package.json keep it green. Do NOT "tidy" either one without
      # re-running `npm audit --audit-level=high` first:
      #
      #   overrides.undici ^7.29.0 — every published miniflare (4.x AND the 5.x
      #     pre-release) pins undici to exactly 7.28.0, the top of the vulnerable
      #     range for 5 high advisories (GHSA-8xcm-r25x-g524, -4cwx-7wf7-3272,
      #     -m8rv-5g2x-5cg5, -jr45-8vmc-qm54, -v3r7-h72x-cjcm). There is no
      #     wrangler release that resolves this on its own, so we force the 7.x
      #     fix line. Drop the override once miniflare ships undici >= 7.29.0.
      #     (jsdom wants ^7.25.0, so the single override satisfies both consumers.)
      #
      #   wrangler ~4.116.0 — the "~" is deliberate. 4.114.0+ is needed for the
      #     sharp >= 0.35.0 fix (GHSA-f88m-g3jw-g9cj, via miniflare), but 4.117.0+
      #     depends on miniflare 5.x-*alpha*. Widening to "^" pulls that
      #     pre-release into the deploy toolchain for a live app and buys nothing
      #     — 4.x and 5.x-alpha resolve to identical sharp/undici versions.
      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high
