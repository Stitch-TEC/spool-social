<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spool — create and draft content for social, blog and job posts, then move it through review, approval and publishing in one place." />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Spool | Stitch TEC" />
    <meta property="og:description" content="Create and draft content for LinkedIn, X, Instagram, Google Business, blogs and job posts — then get client sign-off with a single link." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spool.stitchtec.dev" />
    <meta property="og:image" content="https://spool.stitchtec.dev/spool-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Spool | Stitch TEC</title>
  </head>
  <body>
    <div id="root">
      <!-- Keep a useful, dependency-free first paint in the HTML shell. React
           replaces this node when it starts; if a module cannot execute, the
           installed app never collapses to an unexplained white screen. -->
      <div
        id="spool-boot-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;color:#334155;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center"
      >
        <div style="max-width:28rem">
          <div aria-hidden="true" style="display:flex;width:48px;height:48px;margin:0 auto 16px;align-items:center;justify-content:center;border-radius:14px;background:#0f172a;color:#fff;font-size:22px;font-weight:700">S</div>
          <p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#0f172a">Opening Spool…</p>
          <p style="margin:0;line-height:1.5">Your content is safe. If this screen does not clear, close and reopen Spool.</p>
        </div>
      </div>
      <noscript>Spool needs JavaScript enabled in this browser.</noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
