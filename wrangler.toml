# Cloudflare Worker config for Spool.
# One Worker serves the built SPA (./dist) AND the /api + /media routes.
#
# First-time setup (see CLOUDFLARE_MIGRATION.md for the full runbook):
#   npx wrangler r2 bucket create spool-media
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put INTERNAL_API_KEY
#   npm run build && npx wrangler deploy

name = "spool"
main = "worker/index.js"
compatibility_date = "2026-06-01"

# Cron triggers — scheduled() branches on event.cron (worker/index.js):
#   "0 4 * * *"     nightly (04:00 UTC) sweep of orphaned R2 images (runGC)
#   "*/15 * * * *"  every 15 min: generate drafts for due content automations
#                   (runDueAutomations). Min posting interval is hours, so a
#                   15-min tick is plenty granular and each invocation is cheap.
[triggers]
crons = ["0 4 * * *", "*/15 * * * *"]
# Account is pinned so CI (API-token auth) deploys deterministically.
account_id = "41a9ffb853cf50a278b6a29e90731c60"

# Canonical custom domain — Cloudflare auto-provisions the DNS record + cert
# (the workers.dev URL keeps working alongside it).
routes = [
  { pattern = "spool.stitchtec.dev", custom_domain = true }
]
# Keep the workers.dev URL alive alongside the custom domain (don't break links).
workers_dev = true

# Serve the Vite build output as static assets from the same Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Generated-image storage. R2 has no egress fees, so serving images is ~free.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spool-media"

# Per-principal rate-limit counters (see worker/ratelimit.js).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "52b2367d9e75470d92840c8fbcfbee05"

[vars]
# Firebase project whose ID tokens authenticate Spool app users.
FIREBASE_PROJECT_ID = "spool-social"
# Default Gemini models — override here without code changes (redeploy to apply).
# Upgraded 2026-06-18 from the 2.5 Flash models to the Gemini 3 GA line.
#   text  : gemini-3.5-flash      (GA "most intelligent" Flash; was gemini-2.5-flash)
#   image : gemini-3.1-flash-image ("Nano Banana 2", GA; was gemini-2.5-flash-image)
# For top-tier hero quality, flip the image model to "gemini-3-pro-image"
# ("Nano Banana Pro") — it REQUIRES billing on GEMINI_API_KEY; without billing it
# errors and heroes fall back to the gradient, so confirm billing first.
# Pin GA IDs only — the *-preview variants retire 2026-06-25.
GEMINI_TEXT_MODEL = "gemini-3.5-flash"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
# Comma-separated origins allowed to call /api cross-site (your other projects).
# "*" is fine to start since auth is bearer-token, not cookies.
ALLOWED_ORIGINS = "*"
# Comma-separated emails allowed to use the in-app generation API (Firebase auth).
# Empty = allow any non-anonymous (Google) sign-in. Anonymous/guest tokens are
# always rejected. Set to specific staff emails to lock generation down further.
ALLOWED_EMAILS = ""
# Per-user generation rate limits, backed by the RATE_LIMIT KV namespace below.
# A value of "0" disables that tier. Firebase (in-app) users:
RL_PER_MIN = "10"
RL_PER_DAY = "100"
# Internal API key (trusted server-to-server) — generous; runaway-loop guard.
RL_INTERNAL_PER_MIN = "120"
RL_INTERNAL_PER_DAY = "10000"
# Firebase uid that API-created drafts (POST /api/drafts) are owned by — your
# account's uid (Firebase console → Authentication). Empty disables drafts.
OWNER_UID = "sLcLtGsm9SOKkR82a6cDoLCOOVO2"
# Curated media library: max items per client, and the orphan-GC grace window
# (days, applied only to the generated/ AI cache — never to the media/ library).
MEDIA_PER_CLIENT = "50"
GC_GRACE_DAYS = "365"

# --- Content automation (super-admin-only scheduled generation) --------------
# The cron runner generates drafts in-process, BYPASSING the per-request rate
# gate, so its own dedicated 'automation' rate-limit tier is the hard ceiling on
# how much of the owner's Gemini quota unattended generation can spend. Keep it
# well below the true Gemini quota; "0" would DISABLE the tier — don't.
RL_AUTOMATION_PER_MIN = "20"
RL_AUTOMATION_PER_DAY = "100"
# Max Gemini generations per 15-min tick (text+image = 2). Bounds a single tick.
MAX_GEN_PER_TICK = "10"
# Guard rails on how many automations can exist (per client / total).
AUTO_MAX_PER_CLIENT = "5"
AUTO_MAX_TOTAL = "50"
# Absolute origin the cron runner uses to build /media image URLs (no request in
# a cron context). Must be the public site origin, no trailing slash.
PUBLIC_ORIGIN = "https://spool.stitchtec.dev"

# Secrets are NOT stored here. Set them with `wrangler secret put`:
#   GEMINI_API_KEY            — your Google AI Studio / Gemini API key
#   INTERNAL_API_KEY          — a long random string your own projects send as a Bearer token
#   FIREBASE_SERVICE_ACCOUNT  — the downloaded Firebase service-account JSON (for POST /api/drafts)
