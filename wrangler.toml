# Cloudflare Worker config for Spool.
# One Worker serves the built SPA (./dist) AND the /api + /media routes.
#
# First-time setup (see CLOUDFLARE_MIGRATION.md for the full runbook):
#   npx wrangler r2 bucket create spool-media
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put INTERNAL_API_KEY
#   npm run build && npx wrangler deploy

name = "spool"
main = "worker/index.js"
compatibility_date = "2026-06-01"
# Account is pinned so CI (API-token auth) deploys deterministically.
account_id = "41a9ffb853cf50a278b6a29e90731c60"

# Canonical custom domain — Cloudflare auto-provisions the DNS record + cert
# (the workers.dev URL keeps working alongside it).
routes = [
  { pattern = "spool.stitchtec.dev", custom_domain = true }
]
# Keep the workers.dev URL alive alongside the custom domain (don't break links).
workers_dev = true

# Serve the Vite build output as static assets from the same Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Generated-image storage. R2 has no egress fees, so serving images is ~free.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spool-media"

# Per-principal rate-limit counters (see worker/ratelimit.js).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "52b2367d9e75470d92840c8fbcfbee05"

[vars]
# Firebase project whose ID tokens authenticate Spool app users.
FIREBASE_PROJECT_ID = "spool-social"
# Default Gemini models — override here without code changes.
# On the free tier start with these Flash models; switch to gemini-3.1-flash-image
# / gemini-3-pro-image once billing is enabled (see runbook).
GEMINI_TEXT_MODEL = "gemini-2.5-flash"
GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
# Comma-separated origins allowed to call /api cross-site (your other projects).
# "*" is fine to start since auth is bearer-token, not cookies.
ALLOWED_ORIGINS = "*"
# Comma-separated emails allowed to use the in-app generation API (Firebase auth).
# Empty = allow any non-anonymous (Google) sign-in. Anonymous/guest tokens are
# always rejected. Set to specific staff emails to lock generation down further.
ALLOWED_EMAILS = ""
# Per-user generation rate limits, backed by the RATE_LIMIT KV namespace below.
# A value of "0" disables that tier. Firebase (in-app) users:
RL_PER_MIN = "10"
RL_PER_DAY = "100"
# Internal API key (trusted server-to-server) — generous; runaway-loop guard.
RL_INTERNAL_PER_MIN = "120"
RL_INTERNAL_PER_DAY = "10000"
# Firebase uid that API-created drafts (POST /api/drafts) are owned by — your
# account's uid (Firebase console → Authentication). Empty disables drafts.
OWNER_UID = "sLcLtGsm9SOKkR82a6cDoLCOOVO2"

# Secrets are NOT stored here. Set them with `wrangler secret put`:
#   GEMINI_API_KEY            — your Google AI Studio / Gemini API key
#   INTERNAL_API_KEY          — a long random string your own projects send as a Bearer token
#   FIREBASE_SERVICE_ACCOUNT  — the downloaded Firebase service-account JSON (for POST /api/drafts)
